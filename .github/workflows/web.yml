name: Web

# Publishes the site to GitHub Pages:
#   /            the TypeScript game (game/), tested and built with Vite
#   /prototype/  the frozen C++ Open Fodder prototype, kept to compare feel (ADR-0001)
# The prototype's demo campaigns come from the Run/ submodule (OpenFodder/data) at its pinned commit.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Test and build
        run: |
          npm ci
          npx vitest run
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: game
          path: game/dist

  prototype:
    runs-on: ubuntu-latest
    # Same image as Projects/emscripten/build_emscripten.sh, so a local build matches this one
    container: emscripten/emsdk:6.0.10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -l RunE

      - uses: actions/upload-artifact@v7
        with:
          name: prototype
          path: RunE

  site:
    needs: [game, prototype]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: game
          path: site

      - uses: actions/download-artifact@v8
        with:
          name: prototype
          path: site/prototype

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
