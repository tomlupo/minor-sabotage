<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Minor Sabotage" />
    <meta name="theme-color" content="#24201a" />
    <meta name="description" content="Minor Sabotage (Mały Sabotaż): a squad game of the Polish underground. Demo: Akcja pod Arsenałem, Warsaw, 26 March 1943." />
    <title>Minor Sabotage</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #24201a;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      #safe-probe {
        position: fixed; visibility: hidden; pointer-events: none;
        top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #24201a; color: #e8e4d8; font: 600 17px/1.4 system-ui, sans-serif;
        align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      @media (orientation: portrait) and (max-width: 700px) {
        #rotate { display: flex; }
      }
      /* while the art is drawn at start (a few seconds on a phone); the first screen removes it.
         The page shows before any script runs, so its colours are written here: each is a colour
         of docs/art/palette.json (outline, chalk, hud.paper[0]), held so by tests/colour-literals. */
      #boot {
        position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px; pointer-events: none;
        background: #24201a; color: #d6ccb4; font: 600 13px/1.4 ui-monospace, Menlo, monospace;
        letter-spacing: 0.24em;
      }
      #boot small { font-weight: 400; font-size: 11px; letter-spacing: 0.08em; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="boot">MINOR SABOTAGE<small>Warszawa, 26 marca 1943</small></div>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="safe-probe"></div>
    <div id="rotate"><div>Turn the phone sideways.<br /><small>Minor Sabotage is played in landscape.</small></div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
